# Hive landing page + API — starclaw.me root domain
# Install: cp hive/scripts/nginx-hive.conf /etc/nginx/sites-enabled/hive.conf
# Requires: wildcard SSL cert for *.starclaw.me

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name starclaw.me;
    return 301 https://$host$request_uri;
}

# Main site — landing page + API
server {
    listen 443 ssl http2;
    server_name starclaw.me;

    ssl_certificate     /etc/letsencrypt/live/starclaw.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/starclaw.me/privkey.pem;

    # Landing page (React SPA served by hive-web container)
    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hive Controller API
    location /hive/ {
        proxy_pass http://127.0.0.1:9090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Wildcard subdomain — individual Claw instances
# Each *.starclaw.me is reverse-proxied to its container port
# Config files are auto-generated in /etc/nginx/hive.d/ by Hive Controller
server {
    listen 443 ssl http2;
    server_name *.starclaw.me;

    ssl_certificate     /etc/letsencrypt/live/starclaw.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/starclaw.me/privkey.pem;

    # Include auto-generated per-instance configs
    include /etc/nginx/hive.d/*.conf;

    # Fallback: instance not found
    location / {
        return 404 '{"error":"Claw instance not found"}';
        add_header Content-Type application/json;
    }
}
