server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirect bare /create to /create/
    location = /create {
        return 301 /create/;
    }

    # SPA at /create/ base path (matches Vite base: '/create/')
    location /create/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /create/index.html;
    }

    # Also serve root for direct container access
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to Hive Controller
    location /hive/ {
        proxy_pass http://hive-controller:9090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
