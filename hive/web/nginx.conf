server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # /create → /create/
    location = /create {
        return 301 /create/;
    }

    # SPA — files live at /usr/share/nginx/html/create/ (Vite base='/create/')
    location /create/ {
        try_files $uri $uri/ /create/index.html;
    }

    # Proxy API requests to Hive Controller
    # Use resolver + variable to defer DNS lookup (prevents crash if controller not ready)
    location /hive/ {
        resolver 127.0.0.11 valid=10s;
        set $hive_upstream http://controller:9090;
        proxy_pass $hive_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
