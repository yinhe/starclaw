# Drone 数据源配置 + 采集调度 + 质量阈值
# 🐝 工蜂采集 + 🧬 虫茧同化

sources:
  # ── Tier 1: 公开 API（高频，低同化难度）──
  clawhub:
    name: "ClawHub.ai"
    type: api
    url: "https://clawhub.ai"
    api_base: "https://clawhub.ai/api"
    cron: "0 1 * * *"          # 每天凌晨1点
    mode: incremental
    priority: 1
    cocoon_level: 1             # L1 自动变态（格式几乎一致）
    license: MIT
    notes: "开源 AgentSkills registry，格式与 StarClaw 高度匹配"

  skillhub:
    name: "SkillHub.club"
    type: api
    url: "https://www.skillhub.club"
    api_base: "https://www.skillhub.club/api"
    cron: "0 1 * * *"
    mode: incremental
    priority: 1
    cocoon_level: 1
    notes: "7000+ Claude/Codex/Gemini skills，instructions → system_prompt"

  awesome_gpts:
    name: "GitHub Awesome GPTs"
    type: github
    repos:
      - "ai-boost/awesome-gpts"
      - "taranjeet/awesome-gpts"
      - "friuns/awesome-gpts"
      - "EmbraceAGI/Awesome-AI-GPTs"
    cron: "0 2 * * 1"          # 每周一凌晨2点
    mode: full
    priority: 1
    cocoon_level: 1             # L1，热门的升级到 L2
    notes: "Markdown 表格解析，需要提取 name/description/link"

  dify_templates:
    name: "Dify Marketplace"
    type: api
    url: "https://cloud.dify.ai"
    api_base: "https://cloud.dify.ai/api"
    cron: "0 2 * * 3"          # 每周三
    mode: incremental
    priority: 2
    cocoon_level: 1
    notes: "Agent template 格式清晰"

  langchain_hub:
    name: "LangChain Hub"
    type: api
    url: "https://smith.langchain.com/hub"
    api_base: "https://smith.langchain.com/api"
    cron: "0 2 * * 5"          # 每周五
    mode: incremental
    priority: 2
    cocoon_level: 1
    notes: "Prompt template + Chain，需转换为 system_prompt"

  # ── Tier 2: 轻量爬虫 ──
  coze_market:
    name: "Coze 扣子"
    type: scraper
    url: "https://www.coze.com/store"
    cron: "0 3 * * 2,5"       # 每周二、五
    mode: incremental
    engine: requests
    priority: 3
    cocoon_level: 2             # L2 必须（Bot+Plugin 体系差异大）
    notes: "字节跳动，中国区直连，Bot + Plugin 市场"

  flowgpt:
    name: "FlowGPT"
    type: scraper
    url: "https://flowgpt.com"
    cron: "0 3 * * 4"         # 每周四
    engine: scrapling
    priority: 4
    cocoon_level: 1
    max_pages: 50
    notes: "社区质量参差，需严格质量过滤"

  # ── Tier 3: 反爬（Scrapling）──
  gpts_store:
    name: "GPTs Store"
    type: scraper
    url: "https://chatgpt.com/gpts"
    cron: "0 4 * * 6"         # 每周六
    engine: scrapling
    max_pages: 100
    priority: 5
    cocoon_level: 2             # L2 必须（prompt 风格 OpenAI 专属）
    notes: "Cloudflare 保护，需 Scrapling 反爬"

# ── 质量过滤 ──
quality:
  min_description_length: 20
  min_prompt_length: 50
  max_prompt_length: 50000
  skip_nsfw: true
  skip_keywords:
    - "jailbreak"
    - "DAN"
    - "bypass"
    - "hack"
  auto_translate_en: true       # 英文自动翻译中文
  l2_threshold: 80              # 质量分 >= 80 的走 L2 LLM 进化
  publish_threshold: 60         # 质量分 >= 60 才导入
  dedup_similarity: 0.95        # embedding 相似度 > 0.95 视为重复

# ── 导入配置 ──
import:
  claw_api: "http://localhost:8080"
  queen_api: "https://api.starclaw.net"
  batch_size: 50
  default_status: "pending_review"
  default_pricing: "free"
  creator_id: "system"
  starci_api: "https://api.star-ai.net/v1"  # 用于翻译和 LLM 进化

# ── Pheromone ESB ──
pheromone:
  nats_url: "nats://pheromone-nats:4222"
  events:
    harvest_started: "drone.harvest.started"
    harvest_completed: "drone.harvest.completed"
    harvest_failed: "drone.harvest.failed"
    cocoon_batch: "drone.cocoon.batch"
