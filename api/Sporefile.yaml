# Sporefile.yaml — Claw API build config for Hatchery
name: claw
version: "1.0.0"
description: "StarClaw AI Agent Platform — Claw Node"

build:
  command: |
    CGO_ENABLED=0 GOOS=${TARGET_OS} GOARCH=${TARGET_ARCH} \
    go build -ldflags="-s -w -X github.com/yinhe/starclaw/internal/molt.Version=${VERSION}" \
    -o bin/claw ./cmd/server

package:
  binary: bin/claw
  args: ["serve"]
  include:
    - configs/
    - scripts/
    - plugins/

runtime:
  ports:
    - port: 8080
      protocol: tcp
      description: "API + Web Server"
  health: "http://localhost:8080/health"
  min_memory_mb: 512
  env:
    - CLAW_DATA_DIR=./data
    - CLAW_LOG_LEVEL=info

platforms:
  - linux/amd64
  - linux/arm64
  - darwin/amd64
  - darwin/arm64
  - windows/amd64
