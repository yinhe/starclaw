name: pheromone

services:
  pheromone-api:
    build:
      context: ./api
      args:
        REGISTRY: ${REGISTRY:-docker.io}
    container_name: pheromone-api
    restart: unless-stopped
    environment:
      - PHEROMONE_PORT=8100
      - PHEROMONE_NATS_URL=nats://pheromone-nats:4222
    ports:
      - "8100:8100"
    depends_on:
      pheromone-nats:
        condition: service_healthy

  pheromone-web:
    build:
      context: ./web
      args:
        REGISTRY: ${REGISTRY:-docker.io}
    container_name: pheromone-web
    restart: unless-stopped
    ports:
      - "3110:80"
    depends_on:
      - pheromone-api

  pheromone-nats:
    image: nats:2.10-alpine
    container_name: pheromone-nats
    restart: unless-stopped
    command: ["-c", "/etc/nats/nats.conf"]
    ports:
      - "4222:4222"
      - "8222:8222"
      - "8880:8880"
    volumes:
      - pheromone-nats-data:/data/nats
      - ./nats.conf:/etc/nats/nats.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10

  pheromone-nats-exporter:
    image: natsio/prometheus-nats-exporter:0.14.0
    container_name: pheromone-nats-exporter
    restart: unless-stopped
    command:
      - "-varz"
      - "-connz"
      - "-routez"
      - "-subz"
      - "-channelz"
      - "-jsz=all"
      - "http://pheromone-nats:8222"
    ports:
      - "7777:7777"
    depends_on:
      pheromone-nats:
        condition: service_healthy

volumes:
  pheromone-nats-data:

networks:
  default:
    external: true
    name: starclaw-pheromone
