version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: starclaw-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-starclaw_prod_2026}
      MYSQL_DATABASE: starclaw
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - starclaw-net

  redis:
    image: redis:7-alpine
    container_name: starclaw-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-starclaw_redis_2026}
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-starclaw_redis_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - starclaw-net

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      args:
        BUILD_VERSION: ${BUILD_VERSION:-}
    container_name: starclaw-api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
    environment:
      STARCLAW_SERVER_MODE: release
      STARCLAW_SERVER_DEPLOY_MODE: ${DEPLOY_MODE:-hosted}
      STARCLAW_DATABASE_HOST: mysql
      STARCLAW_DATABASE_PORT: 3306
      STARCLAW_DATABASE_USER: root
      STARCLAW_DATABASE_PASSWORD: ${DB_ROOT_PASSWORD:-starclaw_prod_2026}
      STARCLAW_DATABASE_DBNAME: starclaw
      STARCLAW_REDIS_HOST: redis
      STARCLAW_REDIS_PORT: 6379
      STARCLAW_REDIS_PASSWORD: ${REDIS_PASSWORD:-starclaw_redis_2026}
      STARCLAW_JWT_SECRET: ${JWT_SECRET}
      STARCLAW_OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      STARCLAW_NODE_ADDRESS: https://starclaw.me
      STARCLAW_SWARM_ENABLED: ${SWARM_ENABLED:-false}
      STARCLAW_SWARM_QUEEN_URL: ${SWARM_QUEEN_URL:-https://swarm.starclaw.net}
      OVERLORD_CLAW_TOKEN: ${OVERLORD_CLAW_TOKEN:-overlord-internal-default}
      NODE_KEY_PATH: /app/data/identity/.node_key
    volumes:
      - ./data/identity:/app/data/identity
      - ./data/sandbox:/tmp/starclaw-sandbox
      - ./data/videos:/app/videos
      - ./data/merged_videos:/app/merged_videos
      - ./data/thumbnails:/app/thumbnails
      - ./data/music:/app/music
      - ./data/images:/app/images
      - ./data/workspaces:/app/workspaces
      - ./data/uploads:/app/uploads
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - starclaw-net

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: starclaw-web
    restart: always
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - api
    networks:
      - starclaw-net

networks:
  starclaw-net:
    driver: bridge
