name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-api:
    name: Lint API (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build web frontend (for go:embed)
        run: cd web && npm ci --legacy-peer-deps && npm run build && cp -r dist ../api/internal/web/dist
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: api

  lint-web:
    name: Lint Web (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      - run: cd web && npx tsc --noEmit

  build-api:
    name: Build API
    runs-on: ubuntu-latest
    needs: lint-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build web frontend (for go:embed)
        run: cd web && npm ci --legacy-peer-deps && npm run build && cp -r dist ../api/internal/web/dist
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: api/go.sum
      - name: Build
        run: cd api && CGO_ENABLED=0 go build -o /dev/null ./cmd/server
      - name: Build MCP Bridge
        run: cd api && CGO_ENABLED=0 go build -o /dev/null ./cmd/mcp-bridge

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: lint-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      - run: cd web && npm run build
      - name: Report bundle size
        run: |
          echo "### Bundle Size" >> $GITHUB_STEP_SUMMARY
          ls -lh web/dist/assets/*.js | awk '{print "- "$NF": "$5}' >> $GITHUB_STEP_SUMMARY

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build-api, build-web]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t starclaw-api:ci ./api
      - name: Build Web image
        run: docker build -t starclaw-web:ci ./web
