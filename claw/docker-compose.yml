version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: starclaw-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-starclaw}
      MYSQL_DATABASE: starclaw
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    # ports:
    #   - "${MYSQL_PORT:-3306}:3306"  # Uncomment to access MySQL from host (e.g. for debugging)
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - starclaw

  redis:
    image: redis:7-alpine
    container_name: starclaw-redis
    restart: unless-stopped
    # ports:
    #   - "${REDIS_PORT:-6379}:6379"  # Uncomment to access Redis from host (e.g. for debugging)
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - starclaw

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      args:
        BUILD_VERSION: ${BUILD_VERSION:-}
    container_name: starclaw-api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      STARCLAW_SERVER_MODE: release
      STARCLAW_DATABASE_HOST: mysql
      STARCLAW_DATABASE_PORT: 3306
      STARCLAW_DATABASE_USER: root
      STARCLAW_DATABASE_PASSWORD: ${DB_PASSWORD:-starclaw}
      STARCLAW_DATABASE_DBNAME: starclaw
      STARCLAW_REDIS_HOST: redis
      STARCLAW_REDIS_PORT: 6379
      STARCLAW_JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      STARCLAW_OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      STARCLAW_BRIDGE_PORT: ${BRIDGE_PORT:-9101}
      STARCLAW_SWARM_ENABLED: ${SWARM_ENABLED:-false}
      STARCLAW_SWARM_QUEEN_URL: ${SWARM_QUEEN_URL:-}
      STARCLAW_SWARM_NODE_NAME: ${SWARM_NODE_NAME:-}
      STARCLAW_SWARM_REGION: ${SWARM_REGION:-}
      NODE_KEY_PATH: /app/data/identity/.node_key
    volumes:
      - ./data/identity:/app/data/identity
      - ./data/sandbox:/tmp/starclaw-sandbox
      - ./data/videos:/app/videos
      - ./data/merged_videos:/app/merged_videos
      - ./data/thumbnails:/app/thumbnails
      - ./data/music:/app/music
      - ./data/images:/app/images
      - ./data/workspaces:/app/workspaces
      - ./data/uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - starclaw

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: starclaw-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api
    networks:
      - starclaw

networks:
  starclaw:
    driver: bridge

# Data persisted to ./data/ directory
