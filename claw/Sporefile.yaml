# Sporefile.yaml — Claw Spore Build Configuration
# Build with: hatchery build (or hatchery build --all)

name: claw
version: "0.1.0"
description: "StarClaw AI Agent Node — 智能体平台节点"

build:
  command: |
    CGO_ENABLED=0 GOOS=${TARGET_OS} GOARCH=${TARGET_ARCH} \
    go build -ldflags="-s -w -X github.com/yinhe/starclaw/internal/molt.Version=${VERSION}" \
    -o bin/claw-${TARGET_OS}-${TARGET_ARCH} ./api/cmd/server

  pre_build:
    - cd web && npm ci && npm run build

package:
  binary: bin/claw
  args: ["serve", "--config", "config/default.yaml"]
  include:
    - config/default.yaml
    - web/dist/
  exclude:
    - "*.test"
    - "**/*_test.go"
    - "data/"
    - "*.tar.gz"

runtime:
  ports:
    - port: 8080
      protocol: tcp
      description: "API Server"
    - port: 8443
      protocol: tcp
      description: "API Server (TLS)"
  health: "http://localhost:8080/health"
  min_memory_mb: 256
  recommended_memory_mb: 1024
  env:
    - CLAW_DATA_DIR=/data
    - CLAW_LOG_LEVEL=info

platforms:
  - linux/amd64
  - linux/arm64
  - linux/arm
  - darwin/amd64
  - darwin/arm64
  - windows/amd64

update:
  channel: stable
  auto_update: false
  delta_enabled: true
