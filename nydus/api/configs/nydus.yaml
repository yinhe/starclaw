server:
  port: "8095"
  secret: "nydus-sc2026-vKwRmT9xLpQjN3hB"
  repos_dir: "/data/nydus/repos"
  ssh_user: "git"

repos:
  starclaw:
    description: "StarClaw monorepo"
    public: false
    targets:
      # ========== INTERNAL (Queen 服务端 — 仅限我们自己的服务器) ==========
      # queen/ 代码绝不部署到客户服务器

      - name: "queen-server-c"
        worm_url: "http://nydus-worm:8096"
        deploy_path: "/opt/starclaw-queen"
        deploy_cmd: "docker compose -f docker-compose.prod.yml up -d --build"
        subdir: "queen"
        branch: "master"

      - name: "gateway-server-b"
        ssh_host: "root@47.103.51.32"
        ssh_key: "/root/.ssh/id_ed25519"
        worm_url: "http://127.0.0.1:8097"
        deploy_path: "/opt/starclaw/gateway"
        deploy_cmd: "docker compose -f docker-compose.gateway.yml up -d --build"
        subdir: "queen/api"
        branch: "master"

      # ========== SYNAPSE (star-ai.net AI 算力网关 — Server B) ==========

      - name: "synapse-server-b"
        ssh_host: "root@47.103.51.32"
        ssh_key: "/root/.ssh/id_ed25519"
        worm_url: "http://127.0.0.1:8097"
        deploy_path: "/opt/starclaw/synapse"
        deploy_cmd: "docker compose up -d --build api web"
        subdir: "synapse"
        branch: "master"

      # ========== CEREBRATE (合伙人生态 — Server C 本地, Queen docker-compose 引用) ==========

      - name: "cerebrate-server-c"
        worm_url: "http://nydus-worm:8096"
        deploy_path: "/opt/cerebrate"
        deploy_cmd: "echo 'cerebrate synced (built via queen docker-compose)'"
        subdir: "cerebrate"
        branch: "master"

      # ========== OVERLORD (企业 AI 管控平台 — Server C 本地) ==========

      - name: "overlord-server-c"
        worm_url: "http://nydus-worm:8096"
        deploy_path: "/opt/starclaw-overlord"
        deploy_cmd: "docker compose -f docker-compose.prod.yml up -d --build api console web"
        subdir: "overlord"
        branch: "master"

      # ========== OUR CLAW (我们自己的 Claw 演示实例) ==========

      - name: "claw-starclaw-me"
        ssh_host: "root@starclaw.me"
        ssh_key: "/root/.ssh/id_ed25519"
        deploy_path: "/opt/starclaw"
        deploy_cmd: "bash scripts/server-deploy-update.sh all --no-pull"
        subdir: "claw"
        branch: "master"

      # ========== CUSTOMER CLAWS (客户 Claw — 仅部署 claw/ 开源代码) ==========
      # 客户 Claw 通过 swarm.starclaw.net 加入远程 Queen 生态
      # subdir 必须为 "claw"，绝不允许部署 queen/ 代码
      # NOTE: 快速迭代期间暂时跳过客户节点，避免拖慢部署速度
      #
      # - name: "claw-dgp"
      #   ssh_host: "root@43.106.114.174"
      #   ssh_key: "/root/.ssh/id_ed25519"
      #   deploy_path: "/opt/starclaw"
      #   deploy_cmd: "docker compose up -d --build api web"
      #   subdir: "claw"
      #   branch: "master"

  claw:
    description: "StarClaw open-source AI agent platform"
    public: true
    targets: []

  # ========== Polyrepo: 独立拆分仓库 ==========

  carapace:
    description: "StarClaw crypto & auth library (Go)"
    public: true
    targets: []

  pheromone:
    description: "StarClaw ESB — event bus (NATS + API + WebUI)"
    public: false
    targets: []

  forge:
    description: "StarClaw DevOps — CI/CD orchestrator"
    public: false
    targets: []

  overlord:
    description: "StarClaw enterprise AI management platform"
    public: false
    targets: []

  synapse:
    description: "StarClaw AI compute gateway (star-ai.net)"
    public: false
    targets: []

  nydus:
    description: "StarClaw Git server + deployment system"
    public: false
    targets: []

  hive:
    description: "StarClaw multi-tenant Claw controller"
    public: false
    targets: []

  queen:
    description: "StarClaw central platform — API, Swarm, Web, Core"
    public: false
    targets: []

  cerebrate:
    description: "StarClaw partner ecosystem service"
    public: false
    targets: []

  larva:
    description: "StarClaw incubation / experimental service"
    public: false
    targets: []

  spore:
    description: "StarClaw desktop installer & updater"
    public: true
    targets: []
