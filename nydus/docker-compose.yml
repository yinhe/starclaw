services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: nydus-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8097:8095"
    environment:
      NYDUS_CONFIG: /app/configs/nydus.yaml
      PHEROMONE_NATS_URL: nats://pheromone-nats:4222
    volumes:
      - /data/nydus/repos:/data/nydus/repos
      - /data/nydus/nydus.db:/data/nydus/nydus.db
      - ./api/configs/nydus.yaml:/app/configs/nydus.yaml:ro
      - /root/.ssh/id_ed25519:/root/.ssh/id_ed25519:ro
      - /root/.ssh/known_hosts:/root/.ssh/known_hosts
    networks:
      - starqueen
      - starclaw-pheromone

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: nydus-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8085:80"
    depends_on:
      - api
    networks:
      - starqueen

  worm:
    build:
      context: ./api
      dockerfile: Dockerfile.worm
    container_name: nydus-worm
    restart: unless-stopped
    environment:
      NYDUS_WORM_CONFIG: /app/configs/worm.yaml
    volumes:
      - ./api/configs/worm.yaml:/app/configs/worm.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt:/opt
      - /data/nydus/repos:/data/nydus/repos:ro
    networks:
      - starqueen

networks:
  starqueen:
    name: starqueen
    external: true
  starclaw-pheromone:
    name: starclaw-pheromone
    external: true
