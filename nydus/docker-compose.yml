services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: starclaw-nydus-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8098:8098"
    environment:
      NYDUS_CONFIG: /app/configs/nydus.yaml
      PHEROMONE_NATS_URL: nats://starclaw-pheromone-nats:4222
    volumes:
      - /data/nydus/repos:/data/nydus/repos
      - /data/nydus/nydus.db:/data/nydus/nydus.db
      - ./api/configs/nydus.yaml:/app/configs/nydus.yaml:ro
      - /root/.ssh/id_ed25519:/root/.ssh/id_ed25519:ro
      - /root/.ssh/known_hosts:/root/.ssh/known_hosts
    networks:
      - starclaw-queen
      - starclaw-pheromone

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: starclaw-nydus-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8101:80"
    depends_on:
      - api
    networks:
      - starclaw-queen

  worm:
    build:
      context: ./api
      dockerfile: Dockerfile.worm
    container_name: starclaw-nydus-worm
    restart: unless-stopped
    environment:
      NYDUS_WORM_CONFIG: /app/configs/worm.yaml
    volumes:
      - ./api/configs/worm.yaml:/app/configs/worm.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt:/opt
      - /data/nydus/repos:/data/nydus/repos:ro
    networks:
      - starclaw-queen

networks:
  starclaw-queen:
    name: starclaw-queen
    external: true
  starclaw-pheromone:
    name: starclaw-pheromone
    external: true
