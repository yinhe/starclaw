# ============================================================
# StarClaw Queen — Nginx reverse proxy with HTTPS
# Server: starclaw.net
# Subdomains: api / swarm / core / bounty / forum / arena
#             overseer / partner / city / nydus / proxy
# ============================================================

# --- HTTP → HTTPS redirect (all domains) ---
server {
    listen 80;
    server_name starclaw.net www.starclaw.net
                api.starclaw.net swarm.starclaw.net core.starclaw.net
                bounty.starclaw.net forum.starclaw.net arena.starclaw.net
                overseer.starclaw.net partner.starclaw.net city.starclaw.net
                nydus.starclaw.net proxy.starclaw.net;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Queen Dashboard (starclaw.net) → queen-web :8086 ---
server {
    listen 443 ssl http2;
    server_name starclaw.net www.starclaw.net;

    ssl_certificate     /etc/letsencrypt/live/starclaw.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/starclaw.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css text/javascript application/json application/javascript application/xml image/svg+xml font/woff2;

    location / {
        proxy_pass http://127.0.0.1:8086;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

