# ============================================================
# Go Module Vanity Import for starclaw.net — Polyrepo Mode
# ============================================================
#
# How it works:
#   1. `go get starclaw.net/queen/api` fetches https://starclaw.net/queen/api?go-get=1
#   2. Nginx detects ?go-get=1 and returns go-import meta tag
#   3. Meta tag points Go to the correct per-service repo
#   4. Go clones the repo via git-http-backend on nydus.starclaw.net
#
# INSTALL:
#   1. Add the map block to /etc/nginx/conf.d/go-vanity.conf (http context)
#   2. Replace the old if block in the starclaw.net server block
#   3. nginx -t && nginx -s reload
#
# === Step 1: /etc/nginx/conf.d/go-vanity.conf ===
#
# map $uri $go_import_meta {
#     ~^/carapace     "starclaw.net/carapace git https://nydus.starclaw.net/git/carapace.git";
#     ~^/pheromone    "starclaw.net/pheromone git https://nydus.starclaw.net/git/pheromone.git";
#     ~^/queen        "starclaw.net/queen git https://nydus.starclaw.net/git/queen.git";
#     ~^/forge        "starclaw.net/forge git https://nydus.starclaw.net/git/forge.git";
#     ~^/overlord     "starclaw.net/overlord git https://nydus.starclaw.net/git/overlord.git";
#     ~^/synapse      "starclaw.net/synapse git https://nydus.starclaw.net/git/synapse.git";
#     ~^/hive         "starclaw.net/hive git https://nydus.starclaw.net/git/hive.git";
#     ~^/nydus        "starclaw.net/nydus git https://nydus.starclaw.net/git/nydus.git";
#     ~^/spore        "starclaw.net/spore git https://nydus.starclaw.net/git/spore.git";
#     ~^/larva        "starclaw.net/larva git https://nydus.starclaw.net/git/larva.git";
#     ~^/cerebrate    "starclaw.net/cerebrate git https://nydus.starclaw.net/git/cerebrate.git";
#     default         "starclaw.net git https://nydus.starclaw.net/git/starclaw.git";
# }
#
# === Step 2: Replace if block in starclaw.net server ===
#
#     location / {
#         if ($args ~ "go-get=1") {
#             return 200 '<html><head><meta name="go-import" content="$go_import_meta"></head></html>';
#         }
#         proxy_pass http://127.0.0.1:8086;
#         ...
#     }
#
# === Step 3: nginx -t && nginx -s reload ===
# ============================================================
