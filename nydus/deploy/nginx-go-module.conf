# ============================================================
# Go Module Proxy for starclaw.net
# ============================================================
#
# How it works:
#   1. `go get starclaw.net/queen/api` fetches https://starclaw.net/queen/api?go-get=1
#   2. Nginx detects ?go-get=1 and returns go-import meta tag
#   3. Meta tag points Go to https://nydus.starclaw.net/git/starclaw.git
#   4. Go clones the repo (git-http-backend already running on nydus.starclaw.net)
#   5. Go finds queen/api/go.mod in the repo → module resolved
#
# Git HTTP backend is already configured on nydus.starclaw.net/git/
# so we only need the go-import meta tag on starclaw.net.
#
# INSTALL: Add this snippet inside the starclaw.net HTTPS server block,
#          inside the `location / { ... }` block, BEFORE proxy_pass:
#
#     location / {
#         # --- Go module vanity import ---
#         if ($args ~ "go-get=1") {
#             return 200 '<!DOCTYPE html><html><head><meta name="go-import" content="starclaw.net git https://nydus.starclaw.net/git/starclaw.git"></head><body>go get starclaw.net</body></html>';
#         }
#         proxy_pass http://127.0.0.1:8086;
#         ...
#     }
#
# Then: nginx -t && nginx -s reload
# ============================================================
