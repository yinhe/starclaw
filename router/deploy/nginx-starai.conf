# ============================================================
# Star-AI Router — Nginx reverse proxy with HTTPS
# Server: star-ai.net
#
# Install:
#   sudo certbot certonly --nginx -d star-ai.net -d api.star-ai.net
#   sudo cp deploy/nginx-starai.conf /etc/nginx/sites-available/star-ai
#   sudo ln -sf /etc/nginx/sites-available/star-ai /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# ============================================================

# --- HTTP → HTTPS redirect ---
server {
    listen 80;
    server_name star-ai.net www.star-ai.net api.star-ai.net;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- star-ai.net — Web 前端 (React Dashboard) ---
server {
    listen 443 ssl http2;
    server_name star-ai.net www.star-ai.net;

    ssl_certificate     /etc/letsencrypt/live/star-ai.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/star-ai.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://127.0.0.1:3096;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- api.star-ai.net — Go API 后端 ---
server {
    listen 443 ssl http2;
    server_name api.star-ai.net;

    ssl_certificate     /etc/letsencrypt/live/star-ai.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/star-ai.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:8096;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;

        # SSE streaming support
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;
    }

    # WebSocket (OpenAI Realtime etc.)
    location /v1/ws {
        proxy_pass http://127.0.0.1:8096;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
