version: '3.8'

services:
  mysql-overlord:
    image: mysql:8.0
    container_name: starclaw-overlord-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: starclaw
      MYSQL_DATABASE: starclaw_overlord
    ports:
      - "3308:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
    networks:
      - overlord

  manager:
    build:
      context: ./manager
    container_name: starclaw-overlord-manager
    restart: unless-stopped
    environment:
      OVERLORD_DSN: "root:starclaw@tcp(mysql-overlord:3306)/starclaw_overlord?charset=utf8mb4&parseTime=True&loc=Local"
      OVERLORD_PORT: "8095"
      GIN_MODE: release
    ports:
      - "8095:8095"
    depends_on:
      - mysql-overlord
    networks:
      - overlord

networks:
  overlord:
    driver: bridge
