version: '3.8'

services:
  mysql-overlord:
    image: mysql:8.0
    container_name: starclaw-overlord-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: starclaw
      MYSQL_DATABASE: starclaw_overlord
    ports:
      - "3308:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
    networks:
      - overlord

  api:
    build:
      context: ./api
    container_name: starclaw-overlord-api
    restart: unless-stopped
    environment:
      OVERLORD_DSN: "root:starclaw@tcp(mysql-overlord:3306)/starclaw_overlord?charset=utf8mb4&parseTime=True&loc=Local"
      OVERLORD_PORT: "8095"
      OVERLORD_ADMIN_USERNAME: "${OVERLORD_ADMIN_USERNAME:-admin}"
      OVERLORD_ADMIN_PASSWORD: "${OVERLORD_ADMIN_PASSWORD:-admin123}"
      OVERLORD_MAX_NODES: "${OVERLORD_MAX_NODES:-10}"
      OVERLORD_CLAW_TOKEN: "${OVERLORD_CLAW_TOKEN:-overlord-internal-default}"
      GIN_MODE: release
    ports:
      - "8095:8095"
    depends_on:
      - mysql-overlord
    networks:
      - overlord

  console:
    build:
      context: ./console
    container_name: starclaw-overlord-console
    restart: unless-stopped
    ports:
      - "3095:80"
    depends_on:
      - api
    networks:
      - overlord

  web:
    build:
      context: ./web
    container_name: starclaw-overlord-web
    restart: unless-stopped
    ports:
      - "3096:80"
    depends_on:
      - api
    networks:
      - overlord

networks:
  overlord:
    driver: bridge
