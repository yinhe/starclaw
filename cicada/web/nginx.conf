server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(call|campaign|callback|customers|calls|scripts|analytics|recordings|compliance|health|stats) {
        proxy_pass http://bridge:8099;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
