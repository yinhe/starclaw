name: "金融贷款推广"
industry: finance
voice: longshu

greeting: |
  您好，我是{company}的金融顾问，近期有一批低息贷款产品，
  想了解下您是否有资金需求。

key_points:
  - "年化利率低至{rate}%，远低于市场平均水平"
  - "额度{min_amount}到{max_amount}万，灵活满足不同需求"
  - "最快当天放款，随借随还，提前还款无违约金"

qa_library:
  - q: "利息多少"
    a: "年化利率{rate}%起，具体根据您的资质评估，优质客户还有额外优惠"
  - q: "能贷多少"
    a: "额度{min_amount}到{max_amount}万，根据您的收入和资产综合评估"
  - q: "需要什么条件"
    a: "有稳定收入即可申请，无需抵押，信用良好审批更快"
  - q: "多久放款"
    a: "线上提交资料，审批通过后最快当天放款到您的银行卡"
  - q: "要收手续费吗"
    a: "没有额外手续费，利息就是全部费用，透明无隐藏"
  - q: "怎么还款"
    a: "支持等额本息和先息后本，可以绑定银行卡自动扣款"

objections:
  - trigger: "不需要贷款"
    response: "好的，了解了。如果以后有资金需要可以随时联系我们"
  - trigger: "利息太高"
    response: "我们有多种产品，可以根据您的实际情况匹配最优方案，利率可能更低"
  - trigger: "怕个人信息泄露"
    response: "我们是正规持牌机构，信息严格保密，您可以放心"
  - trigger: "不需要"
    response: "好的，打扰了，祝您生活愉快，再见"

closing:
  positive: "那我帮您做个初步评估，方便告诉我您的大概月收入和需求金额吗？"
  neutral: "我发份产品介绍给您，有需要随时联系我们"
  negative: "好的，感谢您的时间，祝您万事顺利，再见"
