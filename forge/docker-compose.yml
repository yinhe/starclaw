services:
  forge-api:
    build:
      context: ./api
      args:
        REGISTRY: ${REGISTRY:-docker.io}
    container_name: starclaw-forge-api
    ports:
      - "8099:8099"
    volumes:
      - forge-data:/app/data
    environment:
      - FORGE_PORT=8099
      - FORGE_DB_PATH=/app/data/forge.db
      - FORGE_SECRET=${FORGE_SECRET}
      - FORGE_WHITELIST=${FORGE_WHITELIST}
      - NYDUS_URL=${NYDUS_URL:-https://nydus.starclaw.net}
      - OVERLORD_URL=${OVERLORD_URL:-http://overlord-api:8095}
      - DEVBRIDGE_URL=${DEVBRIDGE_URL:-http://host.docker.internal:9102}
      - PHEROMONE_NATS_URL=${PHEROMONE_NATS_URL:-nats://starclaw-pheromone-nats:4222}
      - FORGE_LLM_BASE_URL=${FORGE_LLM_BASE_URL:-https://api.star-ai.net/v1}
      - FORGE_LLM_API_KEY=${FORGE_LLM_API_KEY}
      - FORGE_LLM_MODEL=${FORGE_LLM_MODEL:-deepseek-chat}
    networks:
      - default
      - pheromone
    restart: unless-stopped

  forge-web:
    build:
      context: ./web
      args:
        REGISTRY: ${REGISTRY:-docker.io}
    container_name: starclaw-forge-web
    ports:
      - "3099:3099"
    depends_on:
      - forge-api
    restart: unless-stopped

volumes:
  forge-data:

networks:
  pheromone:
    external: true
    name: starclaw-pheromone
