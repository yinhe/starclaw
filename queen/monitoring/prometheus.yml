global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

scrape_configs:
  # ── Queen Services (same Docker network: starclaw-queen) ──
  - job_name: 'queen-api'
    static_configs:
      - targets: ['queen-api:8085']
    metrics_path: /metrics

  - job_name: 'queen-swarm'
    static_configs:
      - targets: ['swarm:8090']
    metrics_path: /metrics

  - job_name: 'queen-bounty'
    static_configs:
      - targets: ['bounty:8092']
    metrics_path: /metrics

  - job_name: 'queen-forum'
    static_configs:
      - targets: ['forum:8093']
    metrics_path: /metrics

  - job_name: 'queen-arena'
    static_configs:
      - targets: ['arena:8094']
    metrics_path: /metrics

  # ── Overlord (same host, different Docker network) ──
  - job_name: 'overlord-api'
    scrape_interval: 15s
    static_configs:
      - targets: ['host.docker.internal:8098']
    metrics_path: /metrics

  # ── Router / StarAI (Server B) ──
  - job_name: 'router-starai'
    scrape_interval: 30s
    static_configs:
      - targets: ['47.103.51.32:8096']
    metrics_path: /metrics

  # ── External: Claw (starclaw.me) ──
  # Requires Claw /metrics to be accessible from Server C
  # In production, use file_sd_configs or HTTP SD for dynamic discovery
  - job_name: 'claw-starclaw-me'
    scrape_interval: 30s
    static_configs:
      - targets: ['starclaw.me:443']
    scheme: https
    metrics_path: /metrics

  # ── Prometheus self ──
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
