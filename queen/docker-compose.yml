services:
  mysql-queen:
    image: mysql:8.0
    container_name: starclaw-queen-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: starclaw
      MYSQL_DATABASE: starclaw_queen
    ports:
      - "3307:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
    networks:
      - starqueen

  swarm:
    build:
      context: ./swarm
    container_name: starclaw-queen-swarm
    restart: unless-stopped
    environment:
      SWARM_DSN: "root:starclaw@tcp(mysql-queen:3306)/starclaw_queen?charset=utf8mb4&parseTime=True&loc=Local"
      SWARM_PORT: "8090"
      GIN_MODE: release
    ports:
      - "8090:8090"
    depends_on:
      - mysql-queen
    networks:
      - starqueen

  core:
    build:
      context: ./core
    container_name: starclaw-queen-core
    restart: unless-stopped
    ports:
      - "8091:80"
    depends_on:
      - queen-api
    networks:
      - starqueen

  bounty:
    build:
      context: ./bounty
    container_name: starclaw-queen-bounty
    restart: unless-stopped
    environment:
      BOUNTY_DSN: "root:starclaw@tcp(mysql-queen:3306)/starclaw_queen?charset=utf8mb4&parseTime=True&loc=Local"
      BOUNTY_PORT: "8092"
      QUEEN_API_URL: "http://queen-api:8085"
      NODE_TOKEN: "${JWT_SECRET:-queen-jwt-secret-change-me}"
      GIN_MODE: release
    ports:
      - "8092:8092"
    depends_on:
      - mysql-queen
      - queen-api
    networks:
      - starqueen

  forum:
    build:
      context: ./forum
    container_name: starclaw-queen-forum
    restart: unless-stopped
    environment:
      FORUM_DSN: "root:starclaw@tcp(mysql-queen:3306)/starclaw_queen?charset=utf8mb4&parseTime=True&loc=Local"
      FORUM_PORT: "8093"
      GIN_MODE: release
    ports:
      - "8093:8093"
    depends_on:
      - mysql-queen
    networks:
      - starqueen

  arena:
    build:
      context: ./arena
    container_name: starclaw-queen-arena
    restart: unless-stopped
    environment:
      ARENA_DSN: "root:starclaw@tcp(mysql-queen:3306)/starclaw_queen?charset=utf8mb4&parseTime=True&loc=Local"
      ARENA_PORT: "8094"
      GIN_MODE: release
    ports:
      - "8094:8094"
    depends_on:
      - mysql-queen
    networks:
      - starqueen

  queen-api:
    build:
      context: ./api
    container_name: starclaw-queen-api
    restart: unless-stopped
    environment:
      QUEEN_DSN: "root:starclaw@tcp(mysql-queen:3306)/starclaw_queen?charset=utf8mb4&parseTime=True&loc=Local"
      QUEEN_PORT: "8085"
      JWT_SECRET: "queen-jwt-secret-change-me"
      SWARM_URL: "http://swarm:8090"
      BOUNTY_URL: "http://bounty:8092"
      FORUM_URL: "http://forum:8093"
      ARENA_URL: "http://arena:8094"
      GIN_MODE: release
    ports:
      - "8085:8085"
    depends_on:
      - mysql-queen
      - swarm
    networks:
      - starqueen

  queen-web:
    build:
      context: ./web
    container_name: starclaw-queen-web
    restart: unless-stopped
    ports:
      - "8086:80"
    depends_on:
      - queen-api
      - forum
      - arena
      - bounty
    networks:
      - starqueen

  city:
    build:
      context: ../cerebrate/city
    container_name: starclaw-queen-city
    restart: unless-stopped
    ports:
      - "8087:80"
    depends_on:
      - queen-api
    networks:
      - starqueen

  partner:
    build:
      context: ../cerebrate/partner
    container_name: starclaw-queen-partner
    restart: unless-stopped
    ports:
      - "8088:80"
    depends_on:
      - queen-api
    networks:
      - starqueen

networks:
  starqueen:
    name: starqueen
    driver: bridge
