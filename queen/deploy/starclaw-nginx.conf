# ========== HTTP -> HTTPS redirect (all domains) ==========
server {
    if ($host = api.starclaw.me) {
        return 301 https://$host$request_uri;
    }

    if ($host = app.starclaw.me) {
        return 301 https://$host$request_uri;
    }

    if ($host = starclaw.me) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name starclaw.me app.starclaw.me api.starclaw.me;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ========== starclaw.me — 官网 ==========
server {
    listen 443 ssl http2;
    server_name starclaw.me;
    ssl_certificate /etc/letsencrypt/live/starclaw.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/starclaw.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/starclaw/website;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to queen-api
    location /api/ {
        proxy_pass http://127.0.0.1:8085/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

# ========== app.starclaw.me — 前端应用 ==========
server {
    listen 443 ssl http2;
    server_name app.starclaw.me;
    ssl_certificate /etc/letsencrypt/live/starclaw.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/starclaw.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;

        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;
    }
}

# ========== api.starclaw.me — 后端 API ==========
server {
    listen 443 ssl http2;
    server_name api.starclaw.me;
    ssl_certificate /etc/letsencrypt/live/starclaw.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/starclaw.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;

        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;
    }
}
