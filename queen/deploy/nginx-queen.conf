# ============================================================
# StarClaw Queen — Nginx reverse proxy with HTTPS
# Subdomains: swarm / core / bounty / forum / arena
# Domain: *.starclaw.me (wildcard DNS already configured)
#
# Install:
#   sudo cp deploy/nginx-queen.conf /etc/nginx/sites-available/queen
#   sudo ln -sf /etc/nginx/sites-available/queen /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# ============================================================

# --- Swarm (node registration, heartbeat, config) ---
server {
    listen 80;
    server_name swarm.starclaw.me;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name swarm.starclaw.me;

    ssl_certificate     /etc/letsencrypt/live/starclaw.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/starclaw.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

