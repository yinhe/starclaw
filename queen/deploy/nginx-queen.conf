# ============================================================
# StarClaw — ALL starclaw.net subdomains (Server C)
#
# This is the SINGLE nginx config for all *.starclaw.net.
# The old separate nydus / proxy conf files are DEPRECATED.
#
# === SSL (wildcard cert — *.starclaw.net) ===
#
#   Step 1 — Check current cert:
#     sudo openssl x509 -in /etc/letsencrypt/live/starclaw.net/fullchain.pem \
#       -text -noout | grep -A1 "Subject Alternative Name"
#     # Must show: DNS:starclaw.net, DNS:*.starclaw.net
#
#   Step 2 — Issue/renew wildcard cert (DNS-01, NOT --nginx):
#     sudo certbot certonly --manual --preferred-challenges dns \
#       -d starclaw.net -d "*.starclaw.net"
#     # Or auto-renew friendly with Cloudflare plugin:
#     sudo certbot certonly --dns-cloudflare \
#       --dns-cloudflare-credentials /etc/letsencrypt/cloudflare.ini \
#       -d starclaw.net -d "*.starclaw.net"
#
# === Deploy ===
#
#   sudo cp deploy/nginx-queen.conf /etc/nginx/sites-available/queen
#   sudo ln -sf /etc/nginx/sites-available/queen /etc/nginx/sites-enabled/
#   # IMPORTANT: remove old separate configs to avoid duplicate server blocks!
#   sudo rm -f /etc/nginx/sites-enabled/nydus
#   sudo rm -f /etc/nginx/sites-enabled/proxy
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
# ============================================================

# --- Catch-all: reject unknown hosts / mismatched SNI ---
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/starclaw.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/starclaw.net/privkey.pem;

    return 444;
}

# --- HTTP → HTTPS redirect (all starclaw.net subdomains) ---
server {
    listen 80;
    server_name starclaw.net www.starclaw.net api.starclaw.net swarm.starclaw.net core.starclaw.net
               bounty.starclaw.net forum.starclaw.net arena.starclaw.net overseer.starclaw.net
               partner.starclaw.net city.starclaw.net nydus.starclaw.net proxy.starclaw.net;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Queen Dashboard (starclaw.net) ---
server {
    listen 443 ssl http2;
    server_name starclaw.net www.starclaw.net;

    ssl_certificate     /etc/letsencrypt/live/starclaw.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/starclaw.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # CDN-friendly gzip at edge
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css text/javascript application/json application/javascript application/xml image/svg+xml font/woff2;

    location / {
        proxy_pass http://127.0.0.1:8086;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

