# ============================================================
# StarClaw CDN — Common Nginx snippet for all frontends
# Include via: include /etc/nginx/conf.d/cdn-common.conf;
# ============================================================

# ─── Gzip ───
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types
    text/plain
    text/css
    text/javascript
    text/xml
    application/json
    application/javascript
    application/xml
    application/xml+rss
    application/wasm
    image/svg+xml
    font/woff2;

# ─── Security headers ───
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
