services:
  mysql-queen:
    image: mysql:8.0
    container_name: starclaw-queen-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${QUEEN_DB_PASSWORD:-starclaw_queen_2026}
      MYSQL_DATABASE: starclaw_queen
    volumes:
      - ./data/mysql:/var/lib/mysql
    networks:
      - starclaw-queen
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${QUEEN_DB_PASSWORD:-starclaw_queen_2026}"]
      interval: 10s
      timeout: 5s
      retries: 5

  swarm:
    build:
      context: ./swarm
    container_name: starclaw-queen-swarm
    restart: unless-stopped
    environment:
      SWARM_DSN: "root:${QUEEN_DB_PASSWORD:-starclaw_queen_2026}@tcp(mysql-queen:3306)/starclaw_queen?charset=utf8mb4&parseTime=True&loc=Local"
      SWARM_PORT: "8090"
      QUEEN_API_URL: "http://queen-api:8085"
      QUEEN_JWT_SECRET: "${JWT_SECRET:-queen-jwt-secret-change-me}"
      GIN_MODE: release
    ports:
      - "127.0.0.1:8090:8090"
    depends_on:
      mysql-queen:
        condition: service_healthy
    networks:
      - starclaw-queen

  core:
    build:
      context: ./core
    container_name: starclaw-queen-core
    restart: unless-stopped
    ports:
      - "127.0.0.1:8091:80"
    depends_on:
      - queen-api
    networks:
      - starclaw-queen

  bounty:
    build:
      context: ./bounty
    container_name: starclaw-queen-bounty
    restart: unless-stopped
    environment:
      BOUNTY_DSN: "root:${QUEEN_DB_PASSWORD:-starclaw_queen_2026}@tcp(mysql-queen:3306)/starclaw_queen?charset=utf8mb4&parseTime=True&loc=Local"
      BOUNTY_PORT: "8092"
      QUEEN_API_URL: "http://queen-api:8085"
      NODE_TOKEN: "${JWT_SECRET:-queen-jwt-secret-change-me}"
      GIN_MODE: release
    ports:
      - "127.0.0.1:8092:8092"
    depends_on:
      mysql-queen:
        condition: service_healthy
      queen-api:
        condition: service_started
    networks:
      - starclaw-queen

  forum:
    build:
      context: ./forum
    container_name: starclaw-queen-forum
    restart: unless-stopped
    environment:
      FORUM_DSN: "root:${QUEEN_DB_PASSWORD:-starclaw_queen_2026}@tcp(mysql-queen:3306)/starclaw_queen?charset=utf8mb4&parseTime=True&loc=Local"
      FORUM_PORT: "8093"
      GIN_MODE: release
    ports:
      - "127.0.0.1:8093:8093"
    depends_on:
      mysql-queen:
        condition: service_healthy
    networks:
      - starclaw-queen

  arena:
    build:
      context: ./arena
    container_name: starclaw-queen-arena
    restart: unless-stopped
    environment:
      ARENA_DSN: "root:${QUEEN_DB_PASSWORD:-starclaw_queen_2026}@tcp(mysql-queen:3306)/starclaw_queen?charset=utf8mb4&parseTime=True&loc=Local"
      ARENA_PORT: "8094"
      GIN_MODE: release
    ports:
      - "127.0.0.1:8094:8094"
    depends_on:
      mysql-queen:
        condition: service_healthy
    networks:
      - starclaw-queen

  queen-api:
    build:
      context: ./api
    container_name: starclaw-queen-api
    restart: unless-stopped
    environment:
      QUEEN_DSN: "root:${QUEEN_DB_PASSWORD:-starclaw_queen_2026}@tcp(mysql-queen:3306)/starclaw_queen?charset=utf8mb4&parseTime=True&loc=Local"
      QUEEN_PORT: "8085"
      JWT_SECRET: "${JWT_SECRET:-queen-jwt-secret-change-me}"
      SWARM_URL: "http://swarm:8090"
      BOUNTY_URL: "http://bounty:8092"
      FORUM_URL: "http://forum:8093"
      ARENA_URL: "http://arena:8094"
      STARAI_URL: "${STARAI_URL:-https://api.star-ai.net}"
      STARAI_TOKEN: "${STARAI_TOKEN:-}"
      STARAI_CALLBACK_BASE: "${STARAI_CALLBACK_BASE:-}"
      PHEROMONE_NATS_URL: nats://starclaw-pheromone-nats:4222
      GIN_MODE: release
    ports:
      - "127.0.0.1:8085:8085"
    depends_on:
      mysql-queen:
        condition: service_healthy
      swarm:
        condition: service_started
    networks:
      - starclaw-queen
      - starclaw-pheromone

  queen-web:
    build:
      context: ./web
    container_name: starclaw-queen-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8086:80"
    depends_on:
      - queen-api
    networks:
      - starclaw-queen

  # ===================== Landing Page (starclaw.net site) =====================

  queen-site:
    build:
      context: ./site
    container_name: starclaw-queen-site
    restart: unless-stopped
    ports:
      - "127.0.0.1:8097:80"
    networks:
      - starclaw-queen

  # ===================== Overseer (monitoring dashboard) =====================

  overseer:
    build:
      context: ./overseer
    container_name: starclaw-queen-overseer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8087:80"
    depends_on:
      - queen-api
    networks:
      - starclaw-queen

  # ===================== City Partner Portal =====================

  city:
    build:
      context: ../cerebrate/city
    container_name: starclaw-queen-city
    restart: unless-stopped
    ports:
      - "127.0.0.1:8089:80"
    depends_on:
      - queen-api
    networks:
      - starclaw-queen

  # ===================== Partner Portal =====================

  partner:
    build:
      context: ../cerebrate/partner
    container_name: starclaw-queen-partner
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:80"
    depends_on:
      - queen-api
    networks:
      - starclaw-queen

  # ===================== Monitoring =====================

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: starclaw-queen-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - starclaw-queen

volumes:
  prometheus_data:

networks:
  starclaw-queen:
    name: starclaw-queen
    driver: bridge
  starclaw-pheromone:
    name: starclaw-pheromone
    external: true
