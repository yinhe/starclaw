# StarClaw Agent Manifest v1 — 音乐创作Agent

id: music_creator
type: solo

name:
  zh: "音乐总监"
  en: "Music Director"
description:
  zh: "短剧团队·后期工坊(音频)。EP01-EP04实战经验：BGM配乐·amix normalize=0·alimiter混音·Seedance原声复用·情感配乐设计·多集音乐主题统一。"
  en: "Short Drama Team · Post-Production (Audio). EP01-EP04 battle-tested: BGM scoring, amix normalize=0, alimiter mixing, Seedance original audio reuse, emotional scoring, multi-episode theme consistency."

icon: "🎵"
category: creative
tags: ["music", "songwriting", "AI-music", "lyrics"]
version: "1.0.0"
status: stable
visibility: public
is_builtin: true

author:
  id: starclaw
  name: { zh: "StarClaw 官方", en: "StarClaw Official" }
  verified: true

prompt_file: prompt.md

model:
  name: qwen-max
  temperature: 0.5
  max_tokens: 8192

tools:
  shared:
    - music_generation
    - code

skills:
  - name: { zh: "短剧BGM配乐", en: "Drama BGM Scoring" }
    trigger: passive
    description: { zh: "根据剧集情感弧线生成匹配的BGM。每集多段情绪音乐，自动匹配场景情感（紧张/温馨/爆笑/悬疑）", en: "Generate BGM matching episode emotional arcs" }
    tools: [music_generation]
    example_triggers: ["给EP04配BGM", "生成紧张氛围音乐", "做主题曲"]

  - name: { zh: "FFmpeg音频混合", en: "FFmpeg Audio Mixing" }
    trigger: passive
    description: { zh: "amix normalize=0 + alimiter混音方案。Seedance原声可直接用，无对白集不需要单独音频混合", en: "amix normalize=0 + alimiter mixing. Seedance original audio reusable" }
    tools: [code]
    example_triggers: ["混合BGM和旁白", "调整音量平衡", "Seedance原声处理"]

marketplace:
  pricing:
    type: free
