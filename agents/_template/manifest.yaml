# ① Metadata
id: my_agent                          # Must match directory name
type: solo                            # solo | team

name:
  zh: "我的智能体"
  en: "My Agent"
description:
  zh: "一句话描述"
  en: "One-line description"

icon: "🤖"
category: assistant                   # assistant|coding|creative|finance|data|research|support|marketing|content|ecommerce|ops|sales|development
tags: ["demo"]
version: "0.1.0"
status: draft                         # draft | beta | stable | deprecated
visibility: public                    # public | private | unlisted

author:
  id: your_id
  name: { zh: "你的名字", en: "Your Name" }
  # email: you@example.com
  # url: https://your.site
  # verified: false

# ② Prompt
prompt_file: prompt.md
# prompt_files:
#   en: prompt.en.md

# ③ Model
model:
  name: qwen-max
  temperature: 0.3
  max_tokens: 4096

# ④ Tools
tools:
