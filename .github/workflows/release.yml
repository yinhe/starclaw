name: Release

on:
  push:
    tags: ['v*']

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  # ── Step 1: Cross-compile binaries for all platforms ──
  build-binaries:
    name: Build Binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build web frontend (for go:embed)
        run: cd web && npm ci --legacy-peer-deps && npm run build && cp -r dist ../api/internal/web/dist

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: api/go.sum

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build all platform binaries
        working-directory: api
        env:
          V: ${{ steps.version.outputs.VERSION }}
          LDFLAGS_API: "-X github.com/yinhe/starclaw/internal/molt.Version=${{ steps.version.outputs.VERSION }}"
          LDFLAGS_MCP: "-X main.version=${{ steps.version.outputs.VERSION }}"
        run: |
          mkdir -p ../dist

          # StarClaw API server
          GOOS=linux   GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "$LDFLAGS_API" -o ../dist/starclaw-linux-amd64        ./cmd/server
          GOOS=linux   GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "$LDFLAGS_API" -o ../dist/starclaw-linux-arm64        ./cmd/server
          GOOS=darwin  GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "$LDFLAGS_API" -o ../dist/starclaw-darwin-amd64       ./cmd/server
          GOOS=darwin  GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "$LDFLAGS_API" -o ../dist/starclaw-darwin-arm64       ./cmd/server
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "$LDFLAGS_API" -o ../dist/starclaw-windows-amd64.exe  ./cmd/server

          # MCP Bridge (host-side companion)
          GOOS=linux   GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "$LDFLAGS_MCP" -o ../dist/mcp-bridge-linux-amd64        ./cmd/mcp-bridge
          GOOS=linux   GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "$LDFLAGS_MCP" -o ../dist/mcp-bridge-linux-arm64        ./cmd/mcp-bridge
          GOOS=darwin  GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "$LDFLAGS_MCP" -o ../dist/mcp-bridge-darwin-amd64       ./cmd/mcp-bridge
          GOOS=darwin  GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "$LDFLAGS_MCP" -o ../dist/mcp-bridge-darwin-arm64       ./cmd/mcp-bridge
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "$LDFLAGS_MCP" -o ../dist/mcp-bridge-windows-amd64.exe  ./cmd/mcp-bridge

          ls -lh ../dist/

      - name: Package tar.gz archives
        env:
          V: ${{ steps.version.outputs.VERSION }}
        run: |
          cd dist

          # macOS tar.gz (StarClaw API)
          for arch in amd64 arm64; do
            dir="starclaw-darwin-${arch}-v${V}"
            mkdir -p "$dir"
            cp starclaw-darwin-${arch} "$dir/starclaw"
            chmod +x "$dir/starclaw"
            cat > "$dir/README.txt" << 'RDME'
          StarClaw — AI Agent Server

          Quick Start:
            chmod +x starclaw
            ./starclaw

          Config: create configs/config.yaml (see docs)
          Docs:   https://github.com/yinhe/starclaw
          RDME
            tar czf "starclaw-darwin-${arch}.tar.gz" "$dir"
            rm -rf "$dir"
          done

          # macOS tar.gz (MCP Bridge)
          for arch in amd64 arm64; do
            dir="mcp-bridge-darwin-${arch}-v${V}"
            mkdir -p "$dir"
            cp mcp-bridge-darwin-${arch} "$dir/mcp-bridge"
            chmod +x "$dir/mcp-bridge"
            cat > "$dir/install.sh" << 'INST'
          #!/bin/bash
          set -e
          DEST="/usr/local/bin/mcp-bridge"
          cp "$(dirname "$0")/mcp-bridge" "$DEST"
          chmod +x "$DEST"
          xattr -d com.apple.quarantine "$DEST" 2>/dev/null || true
          echo "Installed to $DEST"
          INST
            chmod +x "$dir/install.sh"
            cat > "$dir/README.txt" << 'RDME'
          StarClaw MCP Bridge — Connect your IDE to StarClaw

          Install (recommended):
            chmod +x install.sh && sudo ./install.sh

          Or manual:
            chmod +x mcp-bridge
            sudo cp mcp-bridge /usr/local/bin/

          Usage:  mcp-bridge --server https://your-starclaw:8080
          Docs:   https://github.com/yinhe/starclaw
          RDME
            tar czf "mcp-bridge-darwin-${arch}.tar.gz" "$dir"
            rm -rf "$dir"
          done

          ls -lh *.tar.gz

      - name: Upload binary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/
          retention-days: 1

  # ── Step 2: Build & push Docker images ──
  build-docker:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push API
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          build-args: BUILD_VERSION=${{ steps.version.outputs.VERSION }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-api:${{ steps.version.outputs.VERSION }}
            ${{ env.IMAGE_PREFIX }}-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Web
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-web:${{ steps.version.outputs.VERSION }}
            ${{ env.IMAGE_PREFIX }}-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # — Step 3: Build macOS DMG installers —
  build-dmg:
    name: Build macOS DMG
    runs-on: macos-latest
    needs: [build-binaries]
    permissions:
      contents: read

    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist/

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create DMG for MCP Bridge (Apple Silicon)
        run: |
          mkdir -p dmg-arm64
          cp dist/mcp-bridge-darwin-arm64 dmg-arm64/mcp-bridge
          chmod +x dmg-arm64/mcp-bridge
          cat > dmg-arm64/install.command << 'INST'
          #!/bin/bash
          set -e
          DIR="$(cd "$(dirname "$0")" && pwd)"
          DEST="/usr/local/bin/mcp-bridge"
          sudo cp "$DIR/mcp-bridge" "$DEST"
          sudo chmod +x "$DEST"
          sudo xattr -d com.apple.quarantine "$DEST" 2>/dev/null || true
          echo ""
          echo "\033[32m✓ MCP Bridge installed to $DEST\033[0m"
          echo "  Run: mcp-bridge --server https://your-starclaw:8080"
          echo ""
          read -p "Press Enter to close..."
          INST
          chmod +x dmg-arm64/install.command
          hdiutil create -volname "StarClaw MCP Bridge" -srcfolder dmg-arm64 \
            -ov -format UDZO "dist/mcp-bridge-darwin-arm64.dmg"

      - name: Create DMG for MCP Bridge (Intel)
        run: |
          mkdir -p dmg-amd64
          cp dist/mcp-bridge-darwin-amd64 dmg-amd64/mcp-bridge
          chmod +x dmg-amd64/mcp-bridge
          cat > dmg-amd64/install.command << 'INST'
          #!/bin/bash
          set -e
          DIR="$(cd "$(dirname "$0")" && pwd)"
          DEST="/usr/local/bin/mcp-bridge"
          sudo cp "$DIR/mcp-bridge" "$DEST"
          sudo chmod +x "$DEST"
          sudo xattr -d com.apple.quarantine "$DEST" 2>/dev/null || true
          echo ""
          echo "\033[32m✓ MCP Bridge installed to $DEST\033[0m"
          echo "  Run: mcp-bridge --server https://your-starclaw:8080"
          echo ""
          read -p "Press Enter to close..."
          INST
          chmod +x dmg-amd64/install.command
          hdiutil create -volname "StarClaw MCP Bridge" -srcfolder dmg-amd64 \
            -ov -format UDZO "dist/mcp-bridge-darwin-amd64.dmg"

      - name: Upload DMG artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: |
            dist/mcp-bridge-darwin-arm64.dmg
            dist/mcp-bridge-darwin-amd64.dmg
          retention-days: 1

  # — Step 4: Create GitHub Release with all assets —
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-binaries, build-docker, build-dmg]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist/

      - name: Download DMG artifacts
        uses: actions/download-artifact@v4
        with:
          name: dmg
          path: dist/

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --no-merges -- claw/ 2>/dev/null || git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --no-merges)
          else
            CHANGES=$(git log --pretty=format:"- %s" --no-merges -20)
          fi
          echo "CHANGES<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "StarClaw v${{ steps.version.outputs.VERSION }}"
          generate_release_notes: false
          files: |
            dist/starclaw-linux-amd64
            dist/starclaw-linux-arm64
            dist/starclaw-darwin-amd64
            dist/starclaw-darwin-arm64
            dist/starclaw-darwin-amd64.tar.gz
            dist/starclaw-darwin-arm64.tar.gz
            dist/starclaw-windows-amd64.exe
            dist/mcp-bridge-linux-amd64
            dist/mcp-bridge-linux-arm64
            dist/mcp-bridge-darwin-amd64
            dist/mcp-bridge-darwin-arm64
            dist/mcp-bridge-darwin-amd64.tar.gz
            dist/mcp-bridge-darwin-arm64.tar.gz
            dist/mcp-bridge-darwin-amd64.dmg
            dist/mcp-bridge-darwin-arm64.dmg
            dist/mcp-bridge-windows-amd64.exe
          body: |
            ## Install

            ### 🐳 Docker (server deployment — recommended)
            ```bash
            docker pull ${{ env.REGISTRY }}/${{ github.repository }}-api:${{ steps.version.outputs.VERSION }}
            docker pull ${{ env.REGISTRY }}/${{ github.repository }}-web:${{ steps.version.outputs.VERSION }}
            ```
            Existing servers with Molt auto-update will receive this version automatically.

            ### 💻 Manual Install (local development / MCP Bridge)

            **macOS (recommended: tar.gz or DMG):**
            | Chip | StarClaw API | MCP Bridge | MCP Bridge DMG |
            |------|-------------|------------|----------------|
            | Apple Silicon | `starclaw-darwin-arm64.tar.gz` | `mcp-bridge-darwin-arm64.tar.gz` | `mcp-bridge-darwin-arm64.dmg` |
            | Intel | `starclaw-darwin-amd64.tar.gz` | `mcp-bridge-darwin-amd64.tar.gz` | `mcp-bridge-darwin-amd64.dmg` |

            > DMG: open and double-click `install.command` to install to `/usr/local/bin`.
            > tar.gz: extract and run `sudo ./install.sh` or copy binary manually.

            **Linux / Windows (raw binary):**
            | Platform | StarClaw API | MCP Bridge |
            |----------|-------------|------------|
            | Linux x64 | `starclaw-linux-amd64` | `mcp-bridge-linux-amd64` |
            | Linux ARM64 | `starclaw-linux-arm64` | `mcp-bridge-linux-arm64` |
            | Windows x64 | `starclaw-windows-amd64.exe` | `mcp-bridge-windows-amd64.exe` |

            ## Changes

            ${{ steps.changelog.outputs.CHANGES }}
