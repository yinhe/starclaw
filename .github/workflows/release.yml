name: Release

on:
  push:
    tags: ['v*']

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  # ── Step 1: Cross-compile binaries for all platforms ──
  build-binaries:
    name: Build Binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: api/go.sum

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build all platform binaries
        working-directory: api
        env:
          V: ${{ steps.version.outputs.VERSION }}
          LDFLAGS_API: "-X github.com/yinhe/starclaw/internal/molt.Version=${{ steps.version.outputs.VERSION }}"
          LDFLAGS_MCP: "-X main.version=${{ steps.version.outputs.VERSION }}"
        run: |
          mkdir -p ../dist

          # StarClaw API server
          GOOS=linux   GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "$LDFLAGS_API" -o ../dist/starclaw-linux-amd64        ./cmd/server
          GOOS=linux   GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "$LDFLAGS_API" -o ../dist/starclaw-linux-arm64        ./cmd/server
          GOOS=darwin  GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "$LDFLAGS_API" -o ../dist/starclaw-darwin-amd64       ./cmd/server
          GOOS=darwin  GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "$LDFLAGS_API" -o ../dist/starclaw-darwin-arm64       ./cmd/server
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "$LDFLAGS_API" -o ../dist/starclaw-windows-amd64.exe  ./cmd/server

          # MCP Bridge (host-side companion)
          GOOS=linux   GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "$LDFLAGS_MCP" -o ../dist/mcp-bridge-linux-amd64        ./cmd/mcp-bridge
          GOOS=linux   GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "$LDFLAGS_MCP" -o ../dist/mcp-bridge-linux-arm64        ./cmd/mcp-bridge
          GOOS=darwin  GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "$LDFLAGS_MCP" -o ../dist/mcp-bridge-darwin-amd64       ./cmd/mcp-bridge
          GOOS=darwin  GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "$LDFLAGS_MCP" -o ../dist/mcp-bridge-darwin-arm64       ./cmd/mcp-bridge
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "$LDFLAGS_MCP" -o ../dist/mcp-bridge-windows-amd64.exe  ./cmd/mcp-bridge

          ls -lh ../dist/

      - name: Upload binary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/
          retention-days: 1

  # ── Step 2: Build & push Docker images ──
  build-docker:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push API
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          build-args: BUILD_VERSION=${{ steps.version.outputs.VERSION }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-api:${{ steps.version.outputs.VERSION }}
            ${{ env.IMAGE_PREFIX }}-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Web
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-web:${{ steps.version.outputs.VERSION }}
            ${{ env.IMAGE_PREFIX }}-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Step 3: Package macOS deliverables (tar.gz + DMG) ──
  package-macos:
    name: Package macOS Artifacts
    runs-on: macos-latest
    needs: [build-binaries]
    permissions:
      contents: read

    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist/

      - name: Create macOS packages
        run: |
          mkdir -p pkg/macos-intel pkg/macos-arm64

          cp dist/starclaw-darwin-amd64 pkg/macos-intel/starclaw
          cp dist/mcp-bridge-darwin-amd64 pkg/macos-intel/mcp-bridge
          chmod +x pkg/macos-intel/starclaw pkg/macos-intel/mcp-bridge

          cp dist/starclaw-darwin-arm64 pkg/macos-arm64/starclaw
          cp dist/mcp-bridge-darwin-arm64 pkg/macos-arm64/mcp-bridge
          chmod +x pkg/macos-arm64/starclaw pkg/macos-arm64/mcp-bridge

          tar -czf pkg/starclaw-darwin-amd64.tar.gz -C pkg/macos-intel starclaw mcp-bridge
          tar -czf pkg/starclaw-darwin-arm64.tar.gz -C pkg/macos-arm64 starclaw mcp-bridge

          hdiutil create -volname "StarClaw macOS Intel" -srcfolder pkg/macos-intel -ov -format UDZO pkg/starclaw-darwin-amd64.dmg
          hdiutil create -volname "StarClaw macOS Apple Silicon" -srcfolder pkg/macos-arm64 -ov -format UDZO pkg/starclaw-darwin-arm64.dmg

          ls -lh pkg/

      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: |
            pkg/*.tar.gz
            pkg/*.dmg
          retention-days: 1

  # ── Step 4: Create GitHub Release with all assets ──
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-binaries, build-docker, package-macos]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist/

      - name: Download macOS packages
        uses: actions/download-artifact@v4
        with:
          name: macos-packages
          path: pkg/

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --no-merges -- claw/ 2>/dev/null || git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --no-merges)
          else
            CHANGES=$(git log --pretty=format:"- %s" --no-merges -20)
          fi
          echo "CHANGES<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "StarClaw v${{ steps.version.outputs.VERSION }}"
          generate_release_notes: false
          files: |
            dist/starclaw-linux-amd64
            dist/starclaw-linux-arm64
            dist/starclaw-darwin-amd64
            dist/starclaw-darwin-arm64
            dist/starclaw-windows-amd64.exe
            dist/mcp-bridge-linux-amd64
            dist/mcp-bridge-linux-arm64
            dist/mcp-bridge-darwin-amd64
            dist/mcp-bridge-darwin-arm64
            dist/mcp-bridge-windows-amd64.exe
            pkg/starclaw-darwin-amd64.tar.gz
            pkg/starclaw-darwin-arm64.tar.gz
            pkg/starclaw-darwin-amd64.dmg
            pkg/starclaw-darwin-arm64.dmg
          body: |
            ## Install

            **Docker (recommended):**
            ```bash
            docker pull ${{ env.REGISTRY }}/${{ github.repository }}-api:${{ steps.version.outputs.VERSION }}
            docker pull ${{ env.REGISTRY }}/${{ github.repository }}-web:${{ steps.version.outputs.VERSION }}
            ```

            **Standalone binary:**
            | Platform | StarClaw API | MCP Bridge |
            |----------|-------------|------------|
            | Linux x64 | `starclaw-linux-amd64` | `mcp-bridge-linux-amd64` |
            | Linux ARM64 | `starclaw-linux-arm64` | `mcp-bridge-linux-arm64` |
            | macOS Intel | `starclaw-darwin-amd64` | `mcp-bridge-darwin-amd64` |
            | macOS Apple Silicon | `starclaw-darwin-arm64` | `mcp-bridge-darwin-arm64` |
            | Windows x64 | `starclaw-windows-amd64.exe` | `mcp-bridge-windows-amd64.exe` |

            ## Changes

            ${{ steps.changelog.outputs.CHANGES }}
