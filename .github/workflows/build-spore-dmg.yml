name: Build Spore DMG (macOS)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v2026.0318.0738)'
        required: true
      nydus_base:
        description: 'Nydus releases base URL'
        required: true
        default: 'https://nydus.starclaw.net/spore/releases'

jobs:
  build-dmg:
    name: Build macOS DMGs
    runs-on: macos-latest
    steps:
      - name: Download raw macOS binaries from Nydus
        env:
          V: ${{ github.event.inputs.version }}
          BASE: ${{ github.event.inputs.nydus_base }}
        run: |
          mkdir -p releases
          for arch in arm64 amd64; do
            url="${BASE}/StarClaw-Setup-${V}-darwin-${arch}"
            echo "Downloading $url ..."
            curl -fSL "$url" -o "releases/StarClaw-Setup-${V}-darwin-${arch}" || {
              echo "::warning::Failed to download darwin-${arch}"
              continue
            }
            chmod +x "releases/StarClaw-Setup-${V}-darwin-${arch}"
          done
          ls -lh releases/

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build DMGs
        env:
          V: ${{ github.event.inputs.version }}
        run: |
          for arch in arm64 amd64; do
            RAW="releases/StarClaw-Setup-${V}-darwin-${arch}"
            [ -f "$RAW" ] || continue

            echo "=== Building DMG for darwin-${arch} ==="
            SRC="/tmp/dmg-${arch}"
            rm -rf "$SRC"
            mkdir -p "$SRC"

            # Copy binary (hidden in DMG via dot-prefix)
            cp "$RAW" "$SRC/.StarClaw-Setup"
            chmod +x "$SRC/.StarClaw-Setup"

            # Install command — right-click → Open to bypass Gatekeeper
            cat > "$SRC/Install StarClaw.command" << 'SCRIPT'
          #!/bin/bash
          cd "$(dirname "$0")"
          xattr -cr . 2>/dev/null || true
          chmod +x ./.StarClaw-Setup 2>/dev/null || true
          echo ""
          echo "  ✨ StarClaw Installer"
          echo ""
          ./.StarClaw-Setup "$@"
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            echo ""
            echo "  ❌ Setup exited with error code $STATUS"
            echo ""
            echo "  If macOS blocked the app, try:"
            echo "    System Settings → Privacy & Security → Open Anyway"
            echo "    Or: right-click → Open"
            echo ""
            echo "  Press Enter to close..."
            read -r
          fi
          SCRIPT
            chmod +x "$SRC/Install StarClaw.command"

            # README with Gatekeeper bypass instructions
            cat > "$SRC/README - 请先阅读.txt" << 'README'
          ╔══════════════════════════════════════════╗
          ║     StarClaw Installer - 安装说明        ║
          ╚══════════════════════════════════════════╝

          macOS 会阻止未签名的安装脚本，请按以下步骤安装：

          方法 1（推荐）：右键安装
            1. 右键点击 "Install StarClaw.command"
            2. 选择 "打开"
            3. 在弹出对话框中点击 "打开"

          方法 2：终端安装（最简单）
            打开终端，粘贴以下命令：
            curl -fsSL https://nydus.starclaw.net/spore/install.sh | sh

          方法 3：系统设置
            1. 双击 "Install StarClaw.command"
            2. 点击 "完成"
            3. 打开 系统设置 → 隐私与安全性
            4. 滚动到底部，点击 "仍要打开"

          官网: https://starclaw.me
          README

            DMG_OUT="releases/StarClaw-Setup-${V}-darwin-${arch}.dmg"
            rm -f "$DMG_OUT"

            # create-dmg with polished appearance
            create-dmg \
              --volname "StarClaw Installer" \
              --window-pos 200 120 \
              --window-size 540 380 \
              --icon-size 72 \
              --icon "Install StarClaw.command" 170 180 \
              --icon "README - 请先阅读.txt" 370 180 \
              --hide-extension "Install StarClaw.command" \
              --no-internet-enable \
              "$DMG_OUT" \
              "$SRC/"

            echo "  -> $(basename $DMG_OUT) ($(du -h "$DMG_OUT" | cut -f1))"
          done

          ls -lh releases/*.dmg

      - name: Upload DMG artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spore-dmg-${{ github.event.inputs.version }}
          path: releases/*.dmg
          retention-days: 30
