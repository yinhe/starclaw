name: "Qwen (Alibaba)"
type: "llm"
enabled: true
endpoint: "https://dashscope.aliyuncs.com/compatible-mode/v1"
auth:
  type: "bearer"
  key_env: "DASHSCOPE_API_KEY"
models:
  # Prices from https://help.aliyun.com/zh/model-studio/models (scraped 2026-03-26)
  # NOTE: Qwen uses tiered pricing for long context. Prices below are the base tier (≤32K or ≤128K).
  # Longer inputs cost 1.6-2.8x more. Current billing uses base tier only (MVP).

  # ── Qwen3 Max (阶梯计价: ≤32K=2.5/10, 32-128K=4/16, 128-252K=7/28) ──
  - name: "qwen/qwen3-max"
    type: "chat"
    context_length: 262144
    input_price_cny: 0.0025   # ¥2.5/百万tokens (≤32K基础档)
    output_price_cny: 0.01     # ¥10/百万tokens (思考模式同价)

  # ── Qwen3.5 Plus (阶梯计价: ≤128K=0.8/4.8, 128-256K=2/12, 256K-1M=4/24) ──
  - name: "qwen/qwen3.5-plus"
    type: "chat"
    context_length: 1000000
    input_price_cny: 0.0008   # ¥0.8/百万tokens (≤128K基础档)
    output_price_cny: 0.0048   # ¥4.8/百万tokens (思考模式同价)
  - name: "qwen/qwen3.5-flash"
    type: "chat"
    context_length: 1000000
    input_price_cny: 0.0
    output_price_cny: 0.0

  # ── Qwen Plus (思考模式输出¥8/M, 非思考¥2/M) ──
  - name: "qwen/qwen-plus"
    type: "chat"
    context_length: 1000000
    input_price_cny: 0.0008   # ¥0.8/百万tokens
    output_price_cny: 0.002    # ¥2/百万tokens (非思考模式)

  # ── Qwen Max (旧版, 稳定版) ──
  - name: "qwen/qwen-max"
    type: "chat"
    context_length: 32768
    input_price_cny: 0.0024   # ¥2.4/百万tokens
    output_price_cny: 0.0096   # ¥9.6/百万tokens

  # ── Qwen Turbo / Flash / Long ──
  - name: "qwen/qwen-turbo"
    type: "chat"
    context_length: 1000000
    input_price_cny: 0.0003
    output_price_cny: 0.0006
  - name: "qwen/qwen-flash"
    type: "chat"
    context_length: 131072
    input_price_cny: 0.0
    output_price_cny: 0.0
  - name: "qwen/qwen-long"
    type: "chat"
    context_length: 10000000
    input_price_cny: 0.0005
    output_price_cny: 0.002
  # ── QwQ (推理) ──
  - name: "qwen/qwq-plus"
    type: "reasoning"
    context_length: 131072
    input_price_cny: 0.0008
    output_price_cny: 0.002
  - name: "qwen/qwq-max"
    type: "reasoning"
    context_length: 32768
    input_price_cny: 0.0025   # 2.5 元/百万 tokens (same as qwen-max)
    output_price_cny: 0.01     # 10 元/百万 tokens
  - name: "qwen/qwq-32b"
    type: "reasoning"
    context_length: 32768
    input_price_cny: 0.002
    output_price_cny: 0.006
  # ── 视觉 (VL) ──
  - name: "qwen/qwen3-vl-plus"
    type: "vision"
    context_length: 131072
    input_price_cny: 0.0008
    output_price_cny: 0.002
  - name: "qwen/qwen3-vl-flash"
    type: "vision"
    context_length: 131072
    input_price_cny: 0.0
    output_price_cny: 0.0
  - name: "qwen/qwen-vl-max"
    type: "vision"
    context_length: 32768
    input_price_cny: 0.003
    output_price_cny: 0.009
  - name: "qwen/qwen-vl-plus"
    type: "vision"
    context_length: 131072
    input_price_cny: 0.0008
    output_price_cny: 0.002
  # ── 代码 (Coder) ──
  - name: "qwen/qwen3-coder-plus"
    type: "chat"
    context_length: 131072
    input_price_cny: 0.0008
    output_price_cny: 0.002
  - name: "qwen/qwen3-coder-flash"
    type: "chat"
    context_length: 131072
    input_price_cny: 0.0
    output_price_cny: 0.0
  - name: "qwen/qwen-coder-plus"
    type: "chat"
    context_length: 131072
    input_price_cny: 0.0008
    output_price_cny: 0.002
  - name: "qwen/qwen-coder-turbo"
    type: "chat"
    context_length: 131072
    input_price_cny: 0.002
    output_price_cny: 0.006
  # ── 数学 (Math) ──
  - name: "qwen/qwen-math-plus"
    type: "chat"
    context_length: 4096
    input_price_cny: 0.002
    output_price_cny: 0.006
  - name: "qwen/qwen-math-turbo"
    type: "chat"
    context_length: 4096
    input_price_cny: 0.002
    output_price_cny: 0.006
  # ── 多模态 (Omni) ──
  - name: "qwen/qwen3-omni-flash"
    type: "vision"
    context_length: 131072
    input_price_cny: 0.0
    output_price_cny: 0.0
  - name: "qwen/qwen-omni-turbo"
    type: "vision"
    context_length: 32768
    input_price_cny: 0.0006
    output_price_cny: 0.002
  # ── 深度研究 ──
  - name: "qwen/qwen-deep-research"
    type: "reasoning"
    context_length: 131072
    input_price_cny: 0.002
    output_price_cny: 0.008
  # ── 视频 / 图像 / 语音 / 嵌入 ──
  - name: "qwen/wan2.6-t2v-plus"
    type: "video"
    price_per_call_cny: 0.6
  - name: "qwen/wan2.6-t2i"
    type: "image"
    price_per_call_cny: 0.04
  - name: "qwen/cosyvoice-v1"
    type: "tts"
    price_per_char_cny: 0.00002
  - name: "qwen/text-embedding-v3"
    type: "embedding"
    input_price_cny: 0.0007
regions: ["cn-beijing", "cn-singapore", "us-virginia"]
