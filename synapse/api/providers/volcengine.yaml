name: "Volcengine (ByteDance)"
type: "llm"
enabled: true
endpoint: "https://ark.cn-beijing.volces.com/api/v3"
description: "火山方舟 — 字节跳动豆包大模型平台。Prices from volcengine.com/docs (scraped 2026-03-26)."
auth:
  type: "bearer"
  key_env: "VOLCENGINE_API_KEY"
