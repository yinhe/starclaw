  # Doubao Seed 2.0 系列 (最新旗舰)
  # ══════════════════════════════════════════════════
  - name: "volcengine/doubao-seed-2-0-pro"
    type: "chat"
    context_length: 256000
    input_price_cny: 0.004     # ¥4/百万tokens
    output_price_cny: 0.016    # ¥16/百万tokens (思维链+输出)
    description: "豆包 Seed 2.0 Pro — 旗舰多模态+深度思考"
  - name: "volcengine/doubao-seed-2-0-lite"
    type: "chat"
    context_length: 256000
    input_price_cny: 0.0008    # ¥0.8/百万tokens
    output_price_cny: 0.002    # ¥2/百万tokens
    description: "豆包 Seed 2.0 Lite — 轻量高效"
  - name: "volcengine/doubao-seed-2-0-mini"
    type: "chat"
    context_length: 256000
    input_price_cny: 0.0003    # ¥0.3/百万tokens
    output_price_cny: 0.0006   # ¥0.6/百万tokens
