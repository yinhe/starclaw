server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://extractor-api:8097/;
        proxy_set_header Host $host;
    }

    location /bridge/ {
        proxy_pass http://extractor-bridge:8098/;
        proxy_set_header Host $host;
    }
}
